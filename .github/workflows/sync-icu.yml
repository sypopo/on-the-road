name: Sync Intervals.icu Data

on:
  schedule:
    - cron: '50 15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests oss2

      - name: Run ICU sync script
        env:
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          OSS_KEY: ${{ secrets.OSS_KEY }}
          OSS_SECRET: ${{ secrets.OSS_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: python icu2json.py

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet HEAD data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add data.json
          git commit -m "chore: update intervals.icu data $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Create summary
        run: |
          {
            echo "## Intervals.icu 数据同步完成"
            echo ""
            echo "执行时间: $(date -d '+8 hours' -u '+%Y-%m-%d %H:%M:%S') (北京时间)"
            echo ""
            if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
              echo "数据已更新并推送到仓库"
            else
              echo "数据无变化，跳过提交"
            fi
          } >> $GITHUB_STEP_SUMMARY
