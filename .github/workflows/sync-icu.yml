#!/usr/bin/env python3
# -*- coding: utf-8 -*-

import os
import sys
import subprocess

# 先安装 oss2
try:
    import oss2
except ImportError:
    print("安装 oss2...")
    subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "oss2"])
    import oss2

# 获取配置
oss_key = os.getenv("OSS_KEY", "")
oss_secret = os.getenv("OSS_SECRET", "")
oss_endpoint = os.getenv("OSS_ENDPOINT", "")
oss_bucket = os.getenv("OSS_BUCKET", "")

print()
print("=" * 60)
print("🧪 测试阿里云 OSS 连接")
print("=" * 60)

if not all([oss_key, oss_secret, oss_endpoint, oss_bucket]):
    print("❌ 配置不完整")
    print(f"  OSS_KEY: {'✅' if oss_key else '❌'}")
    print(f"  OSS_SECRET: {'✅' if oss_secret else '❌'}")
    print(f"  OSS_ENDPOINT: {'✅' if oss_endpoint else '❌'}")
    print(f"  OSS_BUCKET: {'✅' if oss_bucket else '❌'}")
    sys.exit(1)

print(f"Bucket: {oss_bucket}")
print(f"Endpoint: {oss_endpoint}")

try:
    # 创建连接
    auth = oss2.Auth(oss_key, oss_secret)
    bucket = oss2.Bucket(auth, f"https://{oss_endpoint}", oss_bucket)

    print()
    print("正在上传测试文件...")

    # 上传测试文件
    test_content = b'{"test": "success", "time": "' + str(__import__('datetime').datetime.now()).encode() + b'"}'
    bucket.put_object("test.json", test_content)

    print("✅ 上传成功！")

    # 验证文件
    print()
    print("正在验证文件...")
    obj = bucket.get_object("test.json")
    content = obj.read()
    print(f"✅ 验证成功！内容: {content.decode()}")

    # 删除测试文件
    print()
    print("清理测试文件...")
    bucket.delete_object("test.json")
    print("✅ 清理完成")

    print()
    print("=" * 60)
    print("🎉 OSS 连接测试成功！")
    print("=" * 60)

except Exception as e:
    print()
    print("=" * 60)
    print(f"❌ OSS 连接失败")
    print(f"错误信息: {e}")
    print("=" * 60)
    sys.exit(1)
